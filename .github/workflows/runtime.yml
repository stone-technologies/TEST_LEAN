name: Pinned proof runtime
on:
  push:
    branches: ['proof/run59-closure']
    paths: ['.github/workflows/runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install pinned Lean
        run: |
          set -euxo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Retrieve pinned mathlib and compiled dependencies
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/proof-runtime"
          cd "$RUNNER_TEMP/proof-runtime"
          git clone https://github.com/leanprover-community/mathlib4 mathlib
          cd mathlib
          git checkout 8f9d9cff6bd728b17a24e163c9402775d9e6a365
          lake exe cache get
          lake env lean --version
          printf 'import Mathlib\n#check MeasureTheory.condExp\n' > RuntimeCheck.lean
          lake env lean RuntimeCheck.lean
      - name: Package runtime in bounded-size parts
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/proof-runtime/toolchain" "$RUNNER_TEMP/runtime-parts"
          cp -a "$HOME/.elan/toolchains/leanprover--lean4---v4.28.0/." "$RUNNER_TEMP/proof-runtime/toolchain/"
          find "$RUNNER_TEMP/proof-runtime" -type d -name .git -prune -exec rm -rf {} +
          cd "$RUNNER_TEMP/proof-runtime"
          printf 'Lean 4.28.0\nmathlib 8f9d9cff6bd728b17a24e163c9402775d9e6a365\n' > PINNED_VERSIONS.txt
          tar --exclude='*.a' --exclude='*.o' --exclude='*.c' --exclude='*.ir' --exclude='*.ilean' --exclude='*.trace' -cf - . | zstd -T2 -3 | split -b 190M -d - "$RUNNER_TEMP/runtime-parts/runtime.tar.zst.part"
          cd "$RUNNER_TEMP/runtime-parts"
          sha256sum runtime.tar.zst.part* > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest
          path: ${{ runner.temp }}/runtime-parts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-00
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part00
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-01
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part01
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-02
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part02
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-03
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part03
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-04
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part04
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-05
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part05
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-06
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part06
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-07
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part07
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-08
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part08
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-part-09
          path: ${{ runner.temp }}/runtime-parts/runtime.tar.zst.part09
          compression-level: 0
          if-no-files-found: ignore
